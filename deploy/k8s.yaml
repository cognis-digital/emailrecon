apiVersion: apps/v1
kind: Deployment
metadata: { name: emailrecon, labels: { app: emailrecon } }
spec:
  replicas: 1
  selector: { matchLabels: { app: emailrecon } }
  template:
    metadata: { labels: { app: emailrecon } }
    spec:
      containers:
        - name: emailrecon
          image: ghcr.io/cognis-digital/emailrecon:latest
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: emailrecon }
spec:
  selector: { app: emailrecon }
  ports: [{ port: 80, targetPort: 8000 }]
